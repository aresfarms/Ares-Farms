# =============================================================================
# Cloud Build — furlong staging images (STAGING-DEPLOY P2.1)
#
# Builds BOTH image targets from the one Dockerfile and pushes them to
# Artifact Registry. Run from the repo root (the owner machine has no local
# Docker; Cloud Build is the P2.1 build path):
#
#   gcloud builds submit --config cloudbuild.yaml --project furlong-staging-499102 .
#
# The upload tarball honors .gcloudignore (gcloud does NOT read .dockerignore),
# so `.env*` and the prebuilt `.next` NEVER leave the laptop; inside Cloud
# Build, docker then applies .dockerignore as usual (P0.3 secret-safety holds
# at both layers).
#
# AFTER the build, record the pushed DIGESTS (P2.1 — Terraform pins by digest,
# never tag):
#   gcloud artifacts docker images describe \
#     us-central1-docker.pkg.dev/furlong-staging-499102/furlong/furlong-core:p2 \
#     --format 'value(image_summary.digest)'
#   (same for furlong-db-migrate:p2)
# Then set core_image / migrator_image in terraform.tfvars using
# <repo>/<name>@sha256:<digest> and run the Stage-2 apply.
# =============================================================================

substitutions:
  _REPO: us-central1-docker.pkg.dev/furlong-staging-499102/furlong

steps:
  # Deployment-blocking canonical authority gates. These run in Cloud Build
  # before either image is built or published, so Artifact Registry can never
  # receive an image that bypasses a registered domain authority boundary.
  - name: node:20-bookworm
    id: verify-canonical-authorities
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run verify:canonical-domain
        npm run smoke:canonical-domain-fail-closed
        npm run smoke:production-source-legal
        npm run smoke:production-financing-authority
        npm run smoke:production-connector-activation
        npm run smoke:production-official-report-authority
        npm run smoke:production-payments-treasury-authorization
        npm run smoke:production-domain-cutover-authorization
        npm run smoke:production-data-classification

  # Runtime image (default final stage: runner)
  - name: gcr.io/cloud-builders/docker
    id: build-core
    args:
      - build
      - --target=runner
      - -t=${_REPO}/furlong-core:p2
      - .

  # Migrator Job image (the `migrator` stage — carries tsx + src + migrations)
  - name: gcr.io/cloud-builders/docker
    id: build-migrator
    args:
      - build
      - --target=migrator
      - -t=${_REPO}/furlong-db-migrate:p2
      - .

images:
  - ${_REPO}/furlong-core:p2
  - ${_REPO}/furlong-db-migrate:p2

# The default compute service account is intentionally DISABLED (security
# hardening — it is over-privileged), and Cloud Build defaults to it. The
# `serviceAccount` field requires a USER-MANAGED SA, so we pin a dedicated
# least-privilege build SA. Provision it once (owner):
#   gcloud iam service-accounts create furlong-build --project furlong-staging-499102
#   gcloud projects add-iam-policy-binding furlong-staging-499102 \
#     --member=serviceAccount:furlong-build@furlong-staging-499102.iam.gserviceaccount.com \
#     --role=roles/logging.logWriter --condition=None
#   gcloud projects add-iam-policy-binding furlong-staging-499102 \
#     --member=serviceAccount:furlong-build@furlong-staging-499102.iam.gserviceaccount.com \
#     --role=roles/artifactregistry.writer --condition=None
#   # A user-managed build SA must also READ the uploaded source tarball. Grant
#   # this on the source bucket only (least privilege), not project-wide:
#   gcloud storage buckets add-iam-policy-binding \
#     gs://furlong-staging-499102_cloudbuild \
#     --member=serviceAccount:furlong-build@furlong-staging-499102.iam.gserviceaccount.com \
#     --role=roles/storage.objectViewer
# CLOUD_LOGGING_ONLY is required whenever a serviceAccount is set.
serviceAccount: projects/furlong-staging-499102/serviceAccounts/furlong-build@furlong-staging-499102.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
