name: Master Volume verification

on:
  push:
    branches:
      - main
      - master-volume-build
  pull_request:
    branches:
      - main

# Master Volume Governance:
# - Vol III: keeps every push and pull request under deterministic,
#   replay-safe verification.
# - Vol III-B: enforces tsc --noEmit, module manifest conformance, public
#   surface and public claims sweeps, every published smoke test, and the
#   Next.js production build on every change.
# - Vol IV: the verification job is the operator continuity gate; failure
#   blocks merge.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Placeholder values keep tsc, smoke tests, and `next build` from
      # failing on environment-variable reads. No CI step talks to a real
      # database, scraper, or external connector.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
      LEDGER_MODE: "OPTION_C"
      DRY_RUN: "true"
      REBUILD_MODE: "STRICT"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ────────────────────────────────────────────────────────────────
      # Personal Document Git Guard — runs first per doctrine
      # §CI Placement. Two-layer scanner (filename pattern + content
      # signature) over the full checked-out tree at HEAD (tree mode
      # per Build 40 hardening §1). No base-range dependency, no
      # shallow-clone ambiguity, no `|| true` swallowing setup errors,
      # no empty-range pass. Suspicious-filename PDFs fail closed.
      # The assertion step requires mode = tree and a non-zero
      # scanned file count before declaring PASS.
      # ────────────────────────────────────────────────────────────────
      - name: Personal document git guard (tree mode, fail-closed)
        run: |
          set -euo pipefail
          OUT="$(npm run --silent verify:no-personal-docs)"
          echo "$OUT"
          MODE=$(printf '%s' "$OUT" | jq -r '.mode // "missing"')
          COUNT=$(printf '%s' "$OUT" | jq -r '.scannedFileCount // 0')
          EXIT=$(printf '%s' "$OUT" | jq -r '.exitCode // 1')
          echo "::notice ::verify:no-personal-docs mode=${MODE} scannedFileCount=${COUNT} exitCode=${EXIT}"
          if [ "$MODE" != "tree" ]; then
            echo "::error ::Build 40 hardening §5: scanner must run in mode=tree (got '${MODE}')."
            exit 1
          fi
          if [ "$COUNT" -lt 1 ]; then
            echo "::error ::Build 40 hardening §5: scannedFileCount must be > 0 (got ${COUNT})."
            exit 1
          fi
          if [ "$EXIT" != "0" ]; then
            echo "::error ::verify:no-personal-docs reported exitCode=${EXIT}."
            exit "$EXIT"
          fi

      - name: Personal document git guard smoke
        run: npm run smoke:no-personal-docs

      - name: TypeScript noEmit
        run: npx tsc --noEmit

      - name: Module manifest conformance
        run: npm run verify:module-manifests

      - name: Public surface gateway
        run: npm run smoke:public-surfaces

      - name: Public claims policy
        run: npm run smoke:claims-public

      - name: Public redaction
        run: npm run smoke:redaction

      - name: Borrower onboarding core
        run: npm run smoke:borrower-onboarding-core

      - name: Financing pathway engine
        run: npm run smoke:financing-pathway-engine

      - name: Readiness assessment
        run: npm run smoke:readiness-assessment

      - name: Environmental intake
        run: npm run smoke:environmental-intake

      - name: Opportunity discovery
        run: npm run smoke:opportunity-discovery

      - name: Public trust
        run: npm run smoke:public-trust

      - name: Lender workflow
        run: npm run smoke:lender-workflow

      - name: Governance evidence engine
        run: npm run smoke:governance-evidence-engine

      - name: Internal certification engine
        run: npm run smoke:certification-engine

      - name: Registry framework
        run: npm run smoke:registry-framework

      - name: Connector certification
        run: npm run smoke:connector-certification

      - name: Advanced intelligence
        run: npm run smoke:advanced-intelligence

      - name: Capital Graph
        run: npm run smoke:capital-graph

      - name: Customer Type Registry
        run: npm run smoke:customer-type-registry

      - name: Revenue Intelligence v2
        run: npm run smoke:revenue-intelligence-v2

      - name: Financing Pathway Engine v2
        run: npm run smoke:financing-pathway-engine-v2

      - name: Opportunity Discovery v2
        run: npm run smoke:opportunity-discovery-v2

      - name: Lender Workflow v2
        run: npm run smoke:lender-workflow-v2

      - name: Advanced Intelligence v2
        run: npm run smoke:advanced-intelligence-v2

      - name: Evidence Engine v2
        run: npm run smoke:evidence-engine-v2

      - name: Certification Engine v2
        run: npm run smoke:certification-engine-v2

      - name: Registry Framework v2
        run: npm run smoke:registry-framework-v2

      - name: Connector Certification v2
        run: npm run smoke:connector-certification-v2

      - name: Borrower Onboarding Core v2
        run: npm run smoke:borrower-onboarding-core-v2

      - name: Readiness Assessment v2
        run: npm run smoke:readiness-assessment-v2

      - name: Environmental Intake v2
        run: npm run smoke:environmental-intake-v2

      - name: Recommendation Precision Harness
        run: npm run smoke:recommendation-precision

      - name: Environmental Compliance v2
        run: npm run smoke:environmental-compliance-v2

      - name: Environmental Risk Assessment v2
        run: npm run smoke:environmental-risk-assessment-v2

      - name: Environmental Escalation Engine v2
        run: npm run smoke:environmental-escalation-engine-v2

      - name: Evidence Resolution Workflow v1
        run: npm run smoke:evidence-resolution-workflow

      - name: Document Evidence Reconciliation v1
        run: npm run smoke:document-evidence-reconciliation

      - name: Data Transparency Posture v1
        run: npm run smoke:data-transparency-posture

      - name: Build Self-Report v1
        run: npm run smoke:build-self-report

      - name: Public Alpha Profile v1
        run: npm run smoke:public-alpha-profile

      - name: Human Authority Registry v1
        run: npm run smoke:human-authority-registry

      - name: Disclosure Audit Gate v1
        run: npm run smoke:disclosure-audit-gate

      - name: Public Alpha Profile v1 — Customer Journey
        run: npm run smoke:public-alpha-customer-journey

      - name: Next.js production build
        run: npm run build
